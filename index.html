<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title -->
    <title>Werner Mendizabal</title>
    <link rel="icon" type="image/webp" href="images/memoji.webp">

    <!-- Meta Description -->
    <meta name="description" content="Links to Werner Mendizabal's projects, music, and profiles.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://nonameentername.github.io/links/">

    <!-- Author Information -->
    <meta name="author" content="Werner Mendizabal">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Werner Mendizabal">
    <meta property="og:description" content="Game developer, software engineer, musician, and artist.">
    <meta property="og:url" content="https://nonameentername.github.io/links/">
    <!--meta property="og:image" content="https://nonameentername.github.io/links/images/avatar.png"-->
    <meta name="twitter:card" content="summary">

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

            <p>🕹️ game developer · software engineer · musician · artist</p>

            <nav class="button-stack" aria-label="Links">

              <!-- Spotify -->
              <a class="button button-spotify" href="https://open.spotify.com/artist/2Ndy0UWMloA9j80uerR3gR?si=Fmha7nwuQS6-wtZzTxjQfw" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/spotify.svg" alt="">Spotify</a>

              <!-- Patreon -->

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/in/werner-mendizabal/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="">LinkedIn</a>

            </nav>
          </main>

      <footer>
      </footer>

    </div>
  </div>
